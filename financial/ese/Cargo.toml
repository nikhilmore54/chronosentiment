[package]
name = "cs-ingest"
version = "0.1.0"
edition = "2021"
description = "Deterministic replay-bound ingest: frozen substrate, timeline, dedupe, archive"

[[bin]]
name = "cs-ingest"
path = "src/main.rs"

[[example]]
name = "live_observatory"
path = "examples/live_observatory.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
