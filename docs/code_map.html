<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Coralys Platform — Interactive Code Map</title>
<style>
:root{--bg:#0d1117;--sf:#161b22;--sf2:#21262d;--bd:#30363d;--tx:#e6edf3;--mu:#8b949e;--ac:#58a6ff;--gr:#3fb950;--or:#d29922;--pu:#bc8cff;--re:#f85149;--te:#39d353;--pi:#f778ba;--ye:#e3b341}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap;z-index:100}
header h1{font-size:15px;font-weight:700;color:var(--ac);white-space:nowrap}
.sub{font-size:11px;color:var(--mu)}
#search{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;color:var(--tx);font-size:13px;width:210px;outline:none;transition:border-color .2s;margin-left:auto}
#search:focus{border-color:var(--ac)}
#search::placeholder{color:var(--mu)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lp{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu);cursor:pointer;padding:3px 9px;border-radius:12px;border:1.5px solid transparent;transition:all .15s;user-select:none}
.lp:hover{border-color:var(--bd);background:var(--sf2)}
.lp.on{border-color:currentColor;color:var(--tx)}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.layout{display:flex;flex:1;overflow:hidden}
#sidebar{width:230px;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;flex-shrink:0}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.sgh{padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;border-bottom:1px solid var(--bd);transition:background .15s}
.sgh:hover{background:var(--sf2)}
.sgh .ch{font-size:9px;transition:transform .2s}
.sgh.cl .ch{transform:rotate(-90deg)}
.sgb.cl{display:none}
.si{padding:5px 12px 5px 22px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--mu);transition:all .15s;border-left:2px solid transparent}
.si:hover{background:var(--sf2);color:var(--tx)}
.si.on{background:rgba(88,166,255,.08);color:var(--ac);border-left-color:var(--ac)}
.si .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0);background-size:28px 28px}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;cursor:grab}
#canvas.grabbing{cursor:grabbing}
.zc{position:absolute;bottom:18px;right:18px;display:flex;flex-direction:column;gap:4px;z-index:50}
.zb{width:30px;height:30px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;user-select:none}
.zb:hover{background:var(--sf2)}
.zlbl{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:3px 6px;font-size:10px;color:var(--mu);text-align:center}
#minimap{position:absolute;bottom:18px;left:18px;width:150px;height:90px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;overflow:hidden;z-index:50}
#mm{width:100%;height:100%}
.node{position:absolute;border-radius:8px;border:1.5px solid;cursor:pointer;transition:box-shadow .2s,transform .15s;user-select:none;min-width:138px}
.node:hover{box-shadow:0 0 0 2px rgba(88,166,255,.4),0 8px 24px rgba(0,0,0,.5);transform:translateY(-1px);z-index:10!important}
.node.sel{box-shadow:0 0 0 2.5px var(--ac),0 8px 24px rgba(0,0,0,.6);z-index:20!important}
.node.dim{opacity:.2}
.nh{padding:8px 10px 5px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px}
.nico{font-size:13px;flex-shrink:0}
.ntitle{font-size:11.5px;font-weight:700;line-height:1.3;flex:1}
.nbadge{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700;white-space:nowrap;margin-left:auto}
.nb{padding:5px 10px 8px;font-size:10px;color:var(--mu);line-height:1.5}
.nfiles{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.nf{background:rgba(255,255,255,.06);border-radius:3px;padding:1px 5px;font-size:9px;font-family:monospace;color:var(--mu)}
#esvg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.edge{fill:none;stroke-width:1.5;opacity:.35;transition:opacity .2s}
.edge.hi{opacity:.9;stroke-width:2.5}
.edge.dim{opacity:.06}
#dp{position:absolute;top:14px;right:14px;width:270px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;z-index:60;display:none;box-shadow:0 8px 32px rgba(0,0,0,.6);max-height:calc(100vh - 100px);overflow-y:auto}
#dp.vis{display:block}
#dp::-webkit-scrollbar{width:4px}
#dp::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.dpc{float:right;background:none;border:none;color:var(--mu);cursor:pointer;font-size:15px;line-height:1;padding:0}
.dpc:hover{color:var(--tx)}
.dpt{font-size:13px;font-weight:700;margin-bottom:3px}
.dpcat{font-size:10px;color:var(--mu);margin-bottom:10px}
.dpsl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:4px;margin-top:10px}
.dpd{font-size:11.5px;line-height:1.6;color:var(--mu)}
.dpf{font-size:10.5px;font-family:monospace;color:var(--ac);padding:2px 6px;background:rgba(88,166,255,.07);border-radius:3px;margin-bottom:2px;word-break:break-all;display:block}
.dpde{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--bd);color:var(--mu);display:inline-block;margin:2px 2px 0 0;cursor:pointer}
.dpde:hover{border-color:var(--ac);color:var(--ac)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:7px 14px;font-size:12px;color:var(--tx);z-index:200;transition:transform .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

NODES.forEach(function(n){
  (n.deps||[]).forEach(function(d){
    EDGES.push({from:n.id,to:d});
  });
});

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
var scale=1,tx=40,ty=40;
var selectedId=null;
var filterCat='all';
var searchQ='';
var isDragging=false,dragStartX=0,dragStartY=0,dragStartTx=0,dragStartTy=0;
var nodeEls={},edgeEls={};

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded',function(){
  buildLegend();
  buildSidebar();
  buildNodes();
  buildEdges();
  applyTransform();
  setupInteraction();
  drawMinimap();
  fitToScreen();
});

// ═══════════════════════════════════════════════════════════════
// BUILD LEGEND
// ═══════════════════════════════════════════════════════════════
function buildLegend(){
  var el=document.getElementById('legend');
  Object.keys(CATS).forEach(function(k){
    var c=CATS[k];
    var p=document.createElement('div');
    p.className='lp on';
    p.dataset.cat=k;
    p.style.color=c.color;
    p.innerHTML='<span class="ld" style="background:'+c.color+'"></span>'+c.label;
    p.addEventListener('click',function(){
      if(filterCat===k){filterCat='all';p.classList.add('on');}
      else{
        filterCat=k;
        document.querySelectorAll('.lp').forEach(function(x){x.classList.remove('on');});
        p.classList.add('on');
      }
      applyFilters();
    });
    el.appendChild(p);
  });
}

// ═══════════════════════════════════════════════════════════════
// BUILD SIDEBAR
// ═══════════════════════════════════════════════════════════════
function buildSidebar(){
  var sb=document.getElementById('sidebar');
  var groups={};
  NODES.forEach(function(n){
    if(!groups[n.cat])groups[n.cat]=[];
    groups[n.cat].push(n);
  });
  Object.keys(CATS).forEach(function(k){
    if(!groups[k])return;
    var c=CATS[k];
    var sec=document.createElement('div');
    var head=document.createElement('div');
    head.className='sgh';
    head.innerHTML='<span>'+c.icon+' '+c.label+'</span><span class="ch">&#9660;</span>';
    var body=document.createElement('div');
    body.className='sgb';
    groups[k].forEach(function(n){
      var item=document.createElement('div');
      item.className='si';
      item.dataset.id=n.id;
      item.innerHTML='<span class="dot" style="background:'+c.color+'"></span>'+n.label;
      item.addEventListener('click',function(){selectNode(n.id);});
      body.appendChild(item);
    });
    head.addEventListener('click',function(){
      head.classList.toggle('cl');
      body.classList.toggle('cl');
    });
    sec.appendChild(head);
    sec.appendChild(body);
    sb.appendChild(sec);
  });
}

// ═══════════════════════════════════════════════════════════════
// BUILD NODES
// ═══════════════════════════════════════════════════════════════
function buildNodes(){
  var canvas=document.getElementById('canvas');
  NODES.forEach(function(n){
    var c=CATS[n.cat];
    var el=document.createElement('div');
    el.className='node';
    el.id='node-'+n.id;
    el.style.left=n.x+'px';
    el.style.top=n.y+'px';
    el.style.borderColor=c.color+'55';
    el.style.background='linear-gradient(135deg,'+hexAlpha(c.color,0.12)+','+hexAlpha(c.color,0.06)+')';
    var files3=n.files.slice(0,3).map(function(f){return '<span class="nf">'+f+'</span>';}).join('');
    el.innerHTML='<div class="nh" style="background:'+hexAlpha(c.color,0.15)+'">'+
      '<span class="nico">'+c.icon+'</span>'+
      '<span class="ntitle">'+n.label+'</span>'+
      '<span class="nbadge" style="background:'+hexAlpha(c.color,0.25)+';color:'+c.color+'">'+n.badge+'</span>'+
      '</div>'+
      '<div class="nb">'+n.sub+'<div class="nfiles">'+files3+'</div></div>';
    el.addEventListener('click',function(e){e.stopPropagation();selectNode(n.id);});
    canvas.appendChild(el);
    nodeEls[n.id]=el;
  });
}

// ═══════════════════════════════════════════════════════════════
// BUILD EDGES
// ═══════════════════════════════════════════════════════════════
function buildEdges(){
  var svg=document.getElementById('esvg');
  EDGES.forEach(function(e,i){
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.classList.add('edge');
    path.id='edge-'+i;
    path.dataset.from=e.from;
    path.dataset.to=e.to;
    var fc=CATS[nodeById(e.from).cat];
    path.style.stroke=fc.color;
    svg.appendChild(path);
    edgeEls[i]=path;
  });
  updateEdgePaths();
}

function nodeById(id){
  for(var i=0;i<NODES.length;i++)if(NODES[i].id===id)return NODES[i];
  return null;
}

function updateEdgePaths(){
  EDGES.forEach(function(e,i){
    var fn=nodeById(e.from);
    var tn=nodeById(e.to);
    if(!fn||!tn)return;
    var fel=nodeEls[e.from];
    var tel=nodeEls[e.to];
    if(!fel||!tel)return;
    var fw=fel.offsetWidth||150,fh=fel.offsetHeight||60;
    var tw=tel.offsetWidth||150,th=tel.offsetHeight||60;
    var x1=fn.x+fw/2,y1=fn.y+fh/2;
    var x2=tn.x+tw/2,y2=tn.y+th/2;
    var cx=(x1+x2)/2;
    var d='M'+x1+','+y1+' C'+cx+','+y1+' '+cx+','+y2+' '+x2+','+y2;
    edgeEls[i].setAttribute('d',d);
  });
}

// ═══════════════════════════════════════════════════════════════
// TRANSFORM
// ═══════════════════════════════════════════════════════════════
function applyTransform(){
  var canvas=document.getElementById('canvas');
  canvas.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
  document.getElementById('zlbl').textContent=Math.round(scale*100)+'%';
  drawMinimap();
}

// ═══════════════════════════════════════════════════════════════
// FIT TO SCREEN
// ═══════════════════════════════════════════════════════════════
function fitToScreen(){
  var wrap=document.getElementById('wrap');
  var ww=wrap.clientWidth,wh=wrap.clientHeight;
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  NODES.forEach(function(n){
    var el=nodeEls[n.id];
    var w=el?el.offsetWidth:150,h=el?el.offsetHeight:60;
    if(n.x<minX)minX=n.x;
    if(n.y<minY)minY=n.y;
    if(n.x+w>maxX)maxX=n.x+w;
    if(n.y+h>maxY)maxY=n.y+h;
  });
  var pad=60;
  var cw=maxX-minX+pad*2,ch=maxY-minY+pad*2;
  var s=Math.min(ww/cw,wh/ch,1);
  scale=Math.max(0.2,Math.min(s,1));
  tx=(ww-cw*scale)/2+pad*scale-minX*scale;
  ty=(wh-ch*scale)/2+pad*scale-minY*scale;
  applyTransform();
}

// ═══════════════════════════════════════════════════════════════
// SELECT NODE
// ═══════════════════════════════════════════════════════════════
function selectNode(id){
  if(selectedId===id){
    selectedId=null;
    clearSelection();
    document.getElementById('dp').classList.remove('vis');
    return;
  }
  selectedId=id;
  var n=nodeById(id);
  if(!n)return;
  // highlight node
  Object.keys(nodeEls).forEach(function(k){
    nodeEls[k].classList.remove('sel','dim');
  });
  nodeEls[id].classList.add('sel');
  // find connected
  var connected={};
  connected[id]=true;
  EDGES.forEach(function(e){
    if(e.from===id)connected[e.to]=true;
    if(e.to===id)connected[e.from]=true;
  });
  Object.keys(nodeEls).forEach(function(k){
    if(!connected[k])nodeEls[k].classList.add('dim');
  });
  // highlight edges
  Object.keys(edgeEls).forEach(function(i){
    var e=EDGES[i];
    edgeEls[i].classList.remove('hi','dim');
    if(e.from===id||e.to===id)edgeEls[i].classList.add('hi');
    else edgeEls[i].classList.add('dim');
  });
  // sidebar
  document.querySelectorAll('.si').forEach(function(el){
    el.classList.toggle('on',el.dataset.id===id);
  });
  // detail panel
  showDetail(n);
  // scroll node into view
  scrollToNode(n);
}

function clearSelection(){
  selectedId=null;
  Object.keys(nodeEls).forEach(function(k){nodeEls[k].classList.remove('sel','dim');});
  Object.keys(edgeEls).forEach(function(i){edgeEls[i].classList.remove('hi','dim');});
  document.querySelectorAll('.si').forEach(function(el){el.classList.remove('on');});
}

function scrollToNode(n){
  var wrap=document.getElementById('wrap');
  var ww=wrap.clientWidth,wh=wrap.clientHeight;
  var el=nodeEls[n.id];
  var w=el?el.offsetWidth:150,h=el?el.offsetHeight:60;
  var cx=n.x+w/2,cy=n.y+h/2;
  tx=ww/2-cx*scale;
  ty=wh/2-cy*scale;
  applyTransform();
}

// ═══════════════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════════════
function showDetail(n){
  var c=CATS[n.cat];
  document.getElementById('dp-title').textContent=n.label;
  document.getElementById('dp-cat').innerHTML='<span style="color:'+c.color+'">'+c.icon+' '+c.label+'</span> &middot; '+n.badge;
  document.getElementById('dp-desc').textContent=n.desc;
  var fwrap=document.getElementById('dp-files-wrap');
  var flist=document.getElementById('dp-files');
  flist.innerHTML='';
  if(n.files&&n.files.length){
    fwrap.style.display='';
    n.files.forEach(function(f){
      var a=document.createElement('span');
      a.className='dpf';
      a.textContent=f;
      flist.appendChild(a);
    });
  } else {
    fwrap.style.display='none';
  }
  var dwrap=document.getElementById('dp-deps-wrap');
  var dlist=document.getElementById('dp-deps');
  dlist.innerHTML='';
  if(n.deps&&n.deps.length){
    dwrap.style.display='';
    n.deps.forEach(function(d){
      var btn=document.createElement('span');
      btn.className='dpde';
      btn.textContent=d;
      btn.addEventListener('click',function(){selectNode(d);});
      dlist.appendChild(btn);
    });
  } else {
    dwrap.style.display='none';
  }
  document.getElementById('dp').classList.add('vis');
}

document.getElementById('dpc').addEventListener('click',function(){
  document.getElementById('dp').classList.remove('vis');
  clearSelection();
});

// ═══════════════════════════════════════════════════════════════
// FILTERS
// ═══════════════════════════════════════════════════════════════
function applyFilters(){
  NODES.forEach(function(n){
    var el=nodeEls[n.id];
    if(!el)return;
    var catOk=(filterCat==='all'||n.cat===filterCat);
    var qOk=matchesFilter(n);
    el.style.display=(catOk&&qOk)?'':'none';
  });
  updateEdgePaths();
  drawMinimap();
}

function matchesFilter(n){
  if(!searchQ)return true;
  var q=searchQ.toLowerCase();
  return n.label.toLowerCase().indexOf(q)>=0||
    n.sub.toLowerCase().indexOf(q)>=0||
    n.desc.toLowerCase().indexOf(q)>=0||
    (n.files||[]).some(function(f){return f.toLowerCase().indexOf(q)>=0;});
}

document.getElementById('search').addEventListener('input',function(){
  searchQ=this.value;
  applyFilters();
});

// ═══════════════════════════════════════════════════════════════
// ZOOM & PAN
// ═══════════════════════════════════════════════════════════════
function setupInteraction(){
  var wrap=document.getElementById('wrap');
  var canvas=document.getElementById('canvas');

  // wheel zoom
  wrap.addEventListener('wheel',function(e){
    e.preventDefault();
    var rect=wrap.getBoundingClientRect();
    var mx=e.clientX-rect.left;
    var my=e.clientY-rect.top;
    var delta=e.deltaY<0?1.1:0.9;
    var ns=Math.max(0.15,Math.min(3,scale*delta));
    tx=mx-(mx-tx)*(ns/scale);
    ty=my-(my-ty)*(ns/scale);
    scale=ns;
    applyTransform();
  },{passive:false});

  // drag pan
  wrap.addEventListener('mousedown',function(e){
    if(e.target.closest('.node')||e.target.closest('#dp'))return;
    isDragging=true;
    dragStartX=e.clientX;
    dragStartY=e.clientY;
    dragStartTx=tx;
    dragStartTy=ty;
    canvas.classList.add('grabbing');
    canvas.classList.remove('grab');
  });
  window.addEventListener('mousemove',function(e){
    if(!isDragging)return;
    tx=dragStartTx+(e.clientX-dragStartX);
    ty=dragStartTy+(e.clientY-dragStartY);
    applyTransform();
  });
  window.addEventListener('mouseup',function(){
    if(!isDragging)return;
    isDragging=false;
    canvas.classList.remove('grabbing');
    canvas.classList.add('grab');
  });

  // click on canvas background deselects
  wrap.addEventListener('click',function(e){
    if(e.target===wrap||e.target===canvas||e.target===document.getElementById('esvg')){
      clearSelection();
      document.getElementById('dp').classList.remove('vis');
    }
  });

  // zoom buttons
  document.getElementById('zi').addEventListener('click',function(){
    var wrap2=document.getElementById('wrap');
    var cx=wrap2.clientWidth/2,cy=wrap2.clientHeight/2;
    var ns=Math.min(3,scale*1.2);
    tx=cx-(cx-tx)*(ns/scale);
    ty=cy-(cy-ty)*(ns/scale);
    scale=ns;
    applyTransform();
  });
  document.getElementById('zo').addEventListener('click',function(){
    var wrap2=document.getElementById('wrap');
    var cx=wrap2.clientWidth/2,cy=wrap2.clientHeight/2;
    var ns=Math.max(0.15,scale*0.8);
    tx=cx-(cx-tx)*(ns/scale);
    ty=cy-(cy-ty)*(ns/scale);
    scale=ns;
    applyTransform();
  });
  document.getElementById('zf').addEventListener('click',fitToScreen);

  // touch support
  var lastTouchDist=null;
  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      lastTouchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    } else if(e.touches.length===1){
      isDragging=true;
      dragStartX=e.touches[0].clientX;
      dragStartY=e.touches[0].clientY;
      dragStartTx=tx;dragStartTy=ty;
    }
  },{passive:true});
  wrap.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&lastTouchDist){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      var ns=Math.max(0.15,Math.min(3,scale*(d/lastTouchDist)));
      scale=ns;lastTouchDist=d;
      applyTransform();
    } else if(e.touches.length===1&&isDragging){
      tx=dragStartTx+(e.touches[0].clientX-dragStartX);
      ty=dragStartTy+(e.touches[0].clientY-dragStartY);
      applyTransform();
    }
  },{passive:true});
  wrap.addEventListener('touchend',function(){isDragging=false;lastTouchDist=null;});
}

// ═══════════════════════════════════════════════════════════════
// MINIMAP
// ═══════════════════════════════════════════════════════════════
function drawMinimap(){
  var mm=document.getElementById('mm');
  var ctx=mm.getContext('2d');
  var mw=mm.offsetWidth||150,mh=mm.offsetHeight||90;
  mm.width=mw;mm.height=mh;
  ctx.clearRect(0,0,mw,mh);
  // compute bounds
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  NODES.forEach(function(n){
    var el=nodeEls[n.id];
    if(el&&el.style.display==='none')return;
    var w=el?el.offsetWidth:150,h=el?el.offsetHeight:60;
    if(n.x<minX)minX=n.x;if(n.y<minY)minY=n.y;
    if(n.x+w>maxX)maxX=n.x+w;if(n.y+h>maxY)maxY=n.y+h;
  });
  if(minX===Infinity)return;
  var pad=20;
  var bw=maxX-minX+pad*2,bh=maxY-minY+pad*2;
  var ms=Math.min(mw/bw,mh/bh);
  var ox=(mw-bw*ms)/2+pad*ms-minX*ms;
  var oy=(mh-bh*ms)/2+pad*ms-minY*ms;
  // draw edges
  EDGES.forEach(function(e){
    var fn=nodeById(e.from),tn=nodeById(e.to);
    if(!fn||!tn)return;
    var fel=nodeEls[e.from],tel=nodeEls[e.to];
    if(fel&&fel.style.display==='none')return;
    if(tel&&tel.style.display==='none')return;
    var fw=fel?fel.offsetWidth:150,fh=fel?fel.offsetHeight:60;
    var tw=tel?tel.offsetWidth:150,th=tel?tel.offsetHeight:60;
    ctx.beginPath();
    ctx.moveTo((fn.x+fw/2)*ms+ox,(fn.y+fh/2)*ms+oy);
    ctx.lineTo((tn.x+tw/2)*ms+ox,(tn.y+th/2)*ms+oy);
    ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.lineWidth=0.5;
    ctx.stroke();
  });
  // draw nodes
  NODES.forEach(function(n){
    var el=nodeEls[n.id];
    if(el&&el.style.display==='none')return;
    var w=el?el.offsetWidth:150,h=el?el.offsetHeight:60;
    var c=CATS[n.cat];
    ctx.fillStyle=hexAlpha(c.color,0.7);
    ctx.fillRect(n.x*ms+ox,n.y*ms+oy,Math.max(w*ms,3),Math.max(h*ms,2));
  });
  // viewport rect
  var wrap=document.getElementById('wrap');
  var ww=wrap.clientWidth,wh=wrap.clientHeight;
  var vx=(-tx/scale)*ms+ox,vy=(-ty/scale)*ms+oy;
  var vw=(ww/scale)*ms,vh=(wh/scale)*ms;
  ctx.strokeStyle='rgba(88,166,255,0.7)';
  ctx.lineWidth=1;
  ctx.strokeRect(vx,vy,vw,vh);
}

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function hexAlpha(hex,a){
  var r=parseInt(hex.slice(1,3),16);
  var g=parseInt(hex.slice(3,5),16);
  var b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}
</script>
</body>
