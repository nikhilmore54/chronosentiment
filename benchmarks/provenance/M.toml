[family]
id                  = "M"
full_name           = "Christofides M-family (large instances)"
instance_count      = 2
customer_range      = "150–199"
in_campaign_scope   = true

[source]
primary             = "CVRPLIB (galgos.inf.puc-rio.br)"
url                 = "https://galgos.inf.puc-rio.br/cvrplib/index.php/en/instances/1"
mirror              = "OR-Library (Beasley, Imperial College London)"
mirror_url          = "http://people.brunel.ac.uk/~mastjjb/jeb/orlib/vrpinfo.html"
notes               = "Two instances: M-n151-k12 and M-n200-k17. These are the large-scale instances from the Christofides 1979 paper, distinct from the CMT set (CMT1–CMT14). Vehicle counts are NOT embedded in the .vrp files — sourced from CVRPLIB catalog."

[publication]
authors             = "Christofides, N., Mingozzi, A., Toth, P."
title               = "The Vehicle Routing Problem"
year                = 1979
book                = "Combinatorial Optimization"
editors             = "Christofides, N., Mingozzi, A., Toth, P., Sandi, C."
publisher           = "Wiley, Chichester"
pages               = "315–338"
notes               = "Same publication as CMT family. M-n151-k12 and M-n200-k17 are the two largest instances from this paper. BKS values in the original paper are heuristic results; current CVRPLIB catalog values reflect improvements by subsequent algorithms."

[objective]
function            = "Minimize total route distance"
multi_objective     = false
fleet_cost          = false
notes               = "Pure distance minimization. No fleet-size penalty in objective."

[coordinate_type]
type                = "EUC_2D"
description         = "2D Euclidean coordinates in TSPLIB format"
coordinate_source   = "NODE_COORD_SECTION in .vrp file"

[rounding]
rule                = "TSPLIB integer rounding"
formula             = "nint(sqrt((x1-x2)^2 + (y1-y2)^2))"
description         = "Distances rounded to nearest integer per TSPLIB convention"
verified            = true

[bks]
source              = "CVRPLIB catalog (current)"
url                 = "https://galgos.inf.puc-rio.br/cvrplib/index.php/en/instances/1"
extraction_method   = "CVRPLIB catalog lookup (not from .vrp COMMENT field)"
value_type          = "Integer (best known — improved over original 1979 values)"
notes               = """
PROVENANCE NOTE (P4):
Registry BKS values: M-n151-k12 = 1053.00, M-n200-k17 = 1373.00.
