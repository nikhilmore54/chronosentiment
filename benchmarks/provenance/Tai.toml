[publication]
authors             = "Taillard, E."
title               = "Parallel Iterative Search Methods for Vehicle Routing Problems"
year                = 1993
journal             = "Networks"
volume              = "23"
number              = "8"
pages               = "661–673"
doi                 = "10.1002/net.3230230804"
notes               = "13 instances across four size groups: 75 (4 instances), 100 (4 instances), 150 (4 instances), 385 (1 instance). BKS values in the original 1993 paper are heuristic results. Current CVRPLIB catalog values reflect improvements by subsequent algorithms over 30+ years."

[objective]
function            = "Minimize total route distance"
multi_objective     = false
fleet_cost          = false
notes               = "Pure distance minimization. No fleet-size penalty in objective."

[coordinate_type]
type                = "EUC_2D"
description         = "2D Euclidean coordinates in TSPLIB format"
coordinate_source   = "NODE_COORD_SECTION in .vrp file"

[rounding]
rule                = "TSPLIB integer rounding"
formula             = "nint(sqrt((x1-x2)^2 + (y1-y2)^2))"
description         = "Distances rounded to nearest integer per TSPLIB convention"
verified            = true
notes               = "Integer rounding confirmed. Coralys uses nint() rounding consistent with TSPLIB. The 'fp=' field in campaign logs records fractional vs integer BKS discrepancy per instance."

[bks]
source              = "CVRPLIB catalog (current)"
url                 = "https://galgos.inf.puc-rio.br/cvrplib/index.php/en/instances/1"
extraction_method   = "CVRPLIB catalog lookup (not from .vrp COMMENT field)"
value_type          = "Float (best known — improved over original 1993 values)"
notes               = """
PROVENANCE NOTE (P4):
Registry BKS values are sourced from the CVRPLIB catalog and reflect current best-known solutions.
These values are significantly better than the original 1993 heuristic results.

Campaign v1.5 observed negative gaps in 5 Tai instances:
  Tai75d:  -7.61% (best=1354, BKS=1468.73)
  Tai100a: -2.06% (best=2097, BKS=2141.07)
  Tai75b:  -2.05% (best=1379, BKS=1407.89)
  Tai100b: -0.29% (best=1935, BKS=1940.55)
  Tai75a:  -0.21% (best=1615, BKS=1618.36)

These negative gaps are under investigation (P4). Working hypotheses:
  1. Fleet semantics mismatch: Coralys may be using more vehicles than K,
     producing shorter routes at the cost of more vehicles.
  2. BKS provenance: registry values may differ from values used by comparison papers.
  3. Distance rounding: float vs integer objective representation.

Stage B verification required before any negative gap can be interpreted as improvement.
"""

