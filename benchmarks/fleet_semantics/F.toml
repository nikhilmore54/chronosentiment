volume      = "42"
number      = "4"
pages       = "626–642"
doi         = "10.1287/opre.42.4.626"

[notes]
derivation  = """
Fisher (1994) formulates the CVRP as minimizing total distance subject to a fleet
of at most K vehicles. The vehicle count K is an upper bound — using fewer vehicles
is permitted if all customers can be served within capacity constraints.

Three instances: F-n45-k4, F-n72-k4, F-n135-k7. Vehicle count encoded in instance name.
"""
campaign_observation = "Campaign v1.5: F-family instances show no systematic negative gaps. Consistent with ATMOST semantics."

