[notes]
derivation  = """
The CMT family is the highest-priority fleet semantics investigation target.

The original 1979 paper defines vehicle routing problems with a fixed fleet.
The question is whether the vehicle count K represents:
  (a) ATMOST(K): optimizer may use fewer vehicles — standard modern CVRP interpretation
  (b) EXACT(K): optimizer must use exactly K vehicles — possible for 1979 formulation

This distinction is critical because:
  - If ATMOST(K): Coralys using routes_used > K would be a constraint violation
  - If EXACT(K): Coralys using routes_used ≠ K would be a constraint violation
  - Either mismatch would explain the observed negative gaps

The CMT instances do NOT embed vehicle count in the .vrp files. Vehicle counts
are stored in the Coralys registry (sourced from CVRPLIB catalog):
  CMT1=5, CMT2=10, CMT3=8, CMT4=12, CMT5=17, CMT6=6, CMT7=11, CMT8=9,
  CMT9=14, CMT10=18, CMT11=11, CMT12=10, CMT13=11, CMT14=10.
"""
campaign_observation = """
Campaign v1.5 observed negative gaps in 7 of 14 CMT instances (up to -32.65% for CMT13).
The FCS module assigned ATMOST(K) as a hypothesis for CMT family.
All instances where routes_used ≤ K produced FCS outcome=VALID.

The CMT13 gap of -32.65% (best=1038, BKS=1541.14) is almost certainly explained
by a fleet semantics or BKS provenance issue rather than a genuine optimizer improvement.
A 32% improvement over the current CVRPLIB BKS would be an extraordinary result
requiring extraordinary evidence.

If routes_used > K for CMT13, the gap is NOT COMPARABLE and must be documented as such.
"""

