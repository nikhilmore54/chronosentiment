]
notes       = """
CMT fleet semantics are the highest-priority P5 investigation item.
The 1979 paper predates the modern ATMOST convention and may have used EXACT semantics.
Resolution of this question will determine whether the observed negative gaps are:
  (a) Constraint violations (routes_used > K with EXACT semantics)
  (b) Fleet semantics mismatches (routes_used > K with ATMOST semantics, but K is wrong)
  (c) BKS provenance issues (registry BKS values are outdated)
  (d) Genuine optimizer improvements (unlikely at -32.65% magnitude)

Until P5 is resolved, CMT fleet semantics remain Unspecified and CMT gap measurements
must be reported as Under Investigation, not as qualified comparisons.
