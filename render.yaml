services:
  - type: web
    name: ultracrew-api
    runtime: rust
    buildCommand: cargo build --release --bin ultracrew_server
    startCommand: ./target/release/ultracrew_server
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false