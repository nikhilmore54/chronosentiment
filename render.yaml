services:
  - type: web
    name: ultracrew-api
    plan: free
    runtime: rust
    buildCommand: cargo build --release --bin ultracrew_server
    startCommand: ./target/release/ultracrew_server
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: ultracrew
    env: static
    buildCommand: cd apps/ultracrew-pilot-portal && npm install && npm run build
    staticPublishPath: apps/ultracrew-pilot-portal/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://ultracrew-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: ultraroster
    env: static
    buildCommand: cd ui/ultracrew && npm install && npm run build
    staticPublishPath: ui/ultracrew/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ultracrew-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: coralys-decision-server
    plan: free
    runtime: rust
    buildCommand: cargo build --release --bin coralys_decision_server
    startCommand: ./target/release/coralys_decision_server
    envVars:
      - key: PORT
        value: 3001

  - type: web
    name: chronosentiment-ui
    env: static
    buildCommand: cd services/ui && npm install && npm run build
    staticPublishPath: services/ui/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://coralys-decision-server.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html