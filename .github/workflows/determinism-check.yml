name: Determinism and Contract Enforcement

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Stable Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal

    - name: Build All
      run: cargo build --all --verbose

    - name: Global Test Verification
      run: cargo test --all --verbose

    - name: Determinism Harness Assertion
      run: cargo test test_determinism_certification_harness -- --nocapture

    - name: API Contract Verification
      run: |
        chmod +x scripts/verify_api_contract.sh
        ./scripts/verify_api_contract.sh

  tier1-alternate-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Stable Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal

    - name: Build trace_replay (release)
      run: cargo build --release --bin trace_replay
      working-directory: core

    - name: Tier 1 Alternate Scenario Smoke Verification
      run: python3 scripts/run_tier1_observability_demo.py --scenario alternate --smoke

  lane3-replay-rerun-guard:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Stable Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal

    - name: Build trace_replay (release)
      run: cargo build --release --bin trace_replay
      working-directory: core

    - name: Replay Rerun Guard Assertion
      run: python3 scripts/lane3_replay_rerun_guard.py --scenario primary

  lane3-reproducibility-envelope:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Stable Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal

    - name: Build trace_replay (release)
      run: cargo build --release --bin trace_replay
      working-directory: core

    - name: Reproducibility Envelope Freeze Assertion
      run: python3 scripts/lane3_reproducibility_envelope.py --scenario primary --check-reference

  lane3-artifact-integrity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Stable Toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal

    - name: Build trace_replay (release)
      run: cargo build --release --bin trace_replay
      working-directory: core

    - name: Artifact Integrity Attestation Verification
      run: python3 scripts/lane3_artifact_integrity_attestation.py --scenario primary --run-tamper-tests --check-reference

  lane2-manifest-ms-inventory:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Manifest Millisecond Impact Inventory Verification
      run: python3 scripts/lane2_manifest_ms_impact_inventory.py --check-reference

  lane2-manifest-ms-assumption-probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Manifest Schema Assumption Probe Verification
      run: python3 scripts/lane2_manifest_ms_assumption_probe.py --check-reference

  lane4-experimental-consumer-labeling:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Experimental Consumer Labeling Audit Verification
      run: python3 scripts/lane4_experimental_consumer_labeling_audit.py --check-reference