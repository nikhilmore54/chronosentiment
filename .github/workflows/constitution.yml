name: Constitutional CI

on:
  push:
    branches: [ main ]
    tags: [ 'constitutional-*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  constitutional-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Cargo build
        run: cargo build --workspace --verbose
      # Product-lane tests only — coralys/ultracrew/roadef adapter suites are
      # out of chronosentiment constitutional scope and blow the runner budget.
      - name: Run product-lane tests
        run: >
          cargo test --quiet
          -p chronosentiment_core
          -p chronosentiment_optimization
          -p chronosentiment_strategies
          -p chronosentiment_financial_core
          -p cs-ingest
          -p chronosentiment_adapter
          -p api
      # -p must precede the filter and `--` or cargo forwards -p to the harness.
      - name: Replay certification
        run: >
          cargo test --release
          -p chronosentiment_core
          -p chronosentiment_strategies
          -p chronosentiment_optimization
          replay -- --test-threads=1
      - name: Sweep determinism test
        run: cargo test -p chronosentiment_strategies sweep_projection --quiet
      - name: Orchestration ordering certification
        run: cargo test -p chronosentiment_core orchestration_execution_order --quiet
      - name: Lint warnings budget (max 5)
        run: |
          cargo clippy -- -D warnings || true
          WARNINGS=$(cargo clippy -- -W warnings 2>&1 | grep "warning:" | wc -l)
          if [ "$WARNINGS" -gt 5 ]; then
            echo "Too many warnings ($WARNINGS)"; exit 1;
          fi
      - name: Forbidden dependency scan
        run: |
          # Top-level src/ predates the core → infrastructure/core layout.
          # Only enforce when that legacy path still exists.
          if [ ! -d src ]; then
            echo "SKIP: no top-level src/ (sources live under infrastructure/ / financial/)"
            exit 0
          fi
          if grep -R "std::fs" src/; then
            echo "Forbidden std::fs usage detected"; exit 1;
          fi
