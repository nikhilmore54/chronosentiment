[package]
name = "chronosentiment_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
chronosentiment_adapter = { version = "0.1.0", path = "../../adapters/chronosentiment" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = "1.24.0"
