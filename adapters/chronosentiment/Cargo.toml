[package]
name = "chronosentiment_adapter"
version = "0.1.0"
edition = "2021"

[dependencies]
coralys-ecology = { path = "../../coralys-ecology" }
coralys-moga = { path = "../../coralys-moga" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
sha2 = "0.10"

[[bin]]
name = "m1_reliance"
path = "src/bin/m1_reliance.rs"

[[bin]]
name = "m5_assessment_predictive_value"
path = "src/bin/m5_assessment_predictive_value.rs"
