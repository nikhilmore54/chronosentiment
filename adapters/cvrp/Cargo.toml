[package]
name = "cvrp"
version = "0.1.0"
edition = "2024"

[dependencies]
coralys-core = { path = "../../coralys-core" }
coralys-moga = { path = "../../coralys-moga" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
coralys-v2 = { path = "../../coralys-v2" }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
[dev-dependencies]
criterion = "0.5"
