[package]
name = "ultracrew"
version = "0.1.0"
edition = "2021"

[dependencies]
coralys-ecology = { path = "../../coralys-ecology" }
coralys-moga = { path = "../../coralys-moga" }
coralys-core = { path = "../../coralys-core" }
coralys-planning = { path = "../../coralys-planning" }
coralys-matching = { path = "../../coralys-matching" }
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
coralys-v2 = { path = "../../coralys-v2" }
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.1"
anyhow = "1.0"
toml = "0.8"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

