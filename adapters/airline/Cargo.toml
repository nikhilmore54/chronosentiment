[package]
name = "coralys-airline"
version = "0.1.0"
edition = "2024"
description = "Coralys Scheduling Domain Model — Layer 1: flight legs, duties, crew, pairings, rotations, and rosters"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1.0"
csv = "1.3"
rand = "0.8"